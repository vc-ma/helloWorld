<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏 - Minesweeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚩 扫雷游戏</h1>
            <div class="controls">
                <div class="game-info">
                    <div class="info-item">
                        <span class="label">雷数:</span>
                        <span id="mine-count">10</span>
                    </div>
                    <div class="info-item">
                        <span class="label">时间:</span>
                        <span id="timer">000</span>
                    </div>
                </div>
                <div class="buttons">
                    <button id="restart-btn" class="btn">🔄 重新开始</button>
                    <select id="difficulty" class="select">
                        <option value="easy">简单 (9×9, 10雷)</option>
                        <option value="medium">中等 (16×16, 40雷)</option>
                        <option value="hard">困难 (30×16, 99雷)</option>
                    </select>
                </div>
            </div>
        </header>
        
        <main>
            <div id="game-board" class="game-board"></div>
            <div id="game-status" class="game-status"></div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
